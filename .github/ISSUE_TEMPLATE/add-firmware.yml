name: Add a firmware to the RemoteFM1 catalog
description: Ask for an FM-1 firmware to be listed in RemoteFM1 (remotefm1.com, the apps, the plugin and the Move).
title: "[catalog] Add <firmware name>"
labels: ["catalog-request"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for asking. Please read the [catalog policy](https://github.com/Quixotic7/remotefm1format/blob/main/docs/CATALOG-POLICY.md) first: it says what is accepted and what we check.

        **You do not need to build an `.rfm1` yourself.** If your firmware has a public repository with a stable release, we can usually build it for you. If you already attach an `.rfm1` to your releases, we use your file unchanged.

        Fields marked * are required. Everything else helps but can be filled in later.

  - type: dropdown
    id: role
    attributes:
      label: Who are you?
      options:
        - I am the firmware's author or a maintainer
        - I am not the author (a suggestion; the author will be asked)
    validations:
      required: true

  - type: input
    id: name
    attributes:
      label: Firmware name
      placeholder: Felucca
    validations:
      required: true

  - type: input
    id: repo
    attributes:
      label: Source repository (public GitHub URL)
      description: The repository we read the source, licence and releases from.
      placeholder: https://github.com/you/your-firmware
    validations:
      required: true

  - type: input
    id: authors
    attributes:
      label: Author name(s), as they should be credited
      description: The credit inside the .rfm1 file comes from its manifest; this is for the card and for checking.
      placeholder: Jane Example
    validations:
      required: true

  - type: input
    id: license
    attributes:
      label: Licence (SPDX)
      description: As in your repository's LICENSE file. A firmware without a licence cannot be redistributed.
      placeholder: GPL-3.0-only
    validations:
      required: true

  - type: input
    id: release
    attributes:
      label: Stable release to list
      description: Preferably a stable GitHub release (not a draft, not a pre-release, a plain version tag like v1.2.3). If you only have a beta and want it listed, give it here and say so under "Anything else".
      placeholder: https://github.com/you/your-firmware/releases/tag/v1.2.3
    validations:
      required: true

  - type: dropdown
    id: build
    attributes:
      label: How is the .rfm1 made?
      options:
        - My release already has an .rfm1 attached (use it unchanged)
        - I build it with fm1-base's tools/build.py --rfm1, but it is not attached yet
        - I build it with FM1VST's fm1_add_rfm1, but it is not attached yet
        - Please build it for me from my release
    validations:
      required: true

  - type: input
    id: rfm1_url
    attributes:
      label: Download URL of the .rfm1 (if your release has one)
      placeholder: https://github.com/you/your-firmware/releases/download/v1.2.3/yourfw-1.2.3.rfm1

  - type: input
    id: id
    attributes:
      label: Firmware id (if you know it)
      description: The manifest id, lower case a-z, 0-9 and _ only, at most 31 characters. Leave empty and we pick one.
      placeholder: yourfw

  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Synth
        - Groovebox
        - Chords
        - Drums
        - Other
    validations:
      required: true

  - type: input
    id: tag
    attributes:
      label: Short subtitle (up to 40 characters)
      placeholder: Granular sampler

  - type: textarea
    id: what
    attributes:
      label: Description (one paragraph, up to 600 characters)
      description: Shown when a user selects your firmware. Plain words, what it does and how it feels.

  - type: input
    id: image
    attributes:
      label: Card picture
      description: A square PNG, JPEG or WebP, up to 1 MiB, 512 x 512 recommended (a screenshot works well). Give its path in your repository, or drop it in the description box above. Leave empty and we capture the firmware's screen.
      placeholder: docs/remotefm1-card.png

  - type: input
    id: site
    attributes:
      label: Firmware web page (optional, https)
      placeholder: https://you.github.io/your-firmware/

  - type: input
    id: editor
    attributes:
      label: Web editor or manager page (optional, https)
      description: Your own page; RemoteFM1 opens it with Web MIDI connected to the firmware running in the app.
      placeholder: https://you.github.io/your-firmware/editor/

  - type: input
    id: port
    attributes:
      label: USB MIDI port name (optional)
      description: Exactly as the firmware's USB descriptor gives it. Editors look for a port with this name.
      placeholder: YourFW FM-1

  - type: checkboxes
    id: extras
    attributes:
      label: Optional extras your build uses (tick what applies; none is fine)
      options:
        - label: RemoteFM1Metadata.json at the repository root (card, skin, labels, target)
        - label: A skin (background image and colours)
        - label: Fixed or live panel labels
        - label: Knob readouts (rd1)
        - label: Move takeover (tk1)
        - label: Engine parameters (ep1)
        - label: Second core on a host thread (cpu2)
        - label: Audio input (ain1)
        - label: More output channels (aout1)
        - label: Fantasy CFW (runs in RemoteFM1 only, uses the shared folder)
        - label: Spoken words through the FM-1 screen reader protocol

  - type: textarea
    id: third_party
    attributes:
      label: Third-party material
      description: Samples, wavetables, fonts, images, presets or code that are not yours. Name each and its licence, or write "none".
      placeholder: none
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmations
      options:
        - label: The firmware's licence allows anyone to redistribute it in binary form, and its source is public at the release's commit.
          required: true
        - label: I have the right to have it distributed (I am the author, or the licence allows it and I have said above that I am not the author).
          required: true
        - label: No third-party preset dumps or raw .syx / .mid / .wav files are bundled; presets compiled into the firmware are fine if their licence allows it.
          required: true
        - label: I understand that listing, hosting and removal are the catalog maintainer's decision, and that the file is shipped unchanged once it passes the checks.
          required: true

  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Known issues in the browser or on the Move, a beta you would rather we waited on, people to credit.
