name: Add a firmware to the RemoteFM1 catalog
description: Ask for an FM-1 firmware to be listed in RemoteFM1 (remotefm1.com, the apps, the plugin and the Move).
title: "[catalog] Add <firmware name>"
labels: ["catalog-request"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for asking. Authors and fans are both welcome. The [catalog policy](https://github.com/Quixotic7/remotefm1format/blob/main/docs/CATALOG-POLICY.md) has the details.

        **The firmware's releases have `.rfm1` files:** a link is all we need. (Authors: put the Ableton Move version, `.rfm1m`, in the same release: [how](https://github.com/Quixotic7/remotefm1format/blob/main/docs/RFM1M.md#building-the-move-version-yourself).)

        **It only has FM-1 releases (`.fwsc`):** give its repository and release, and we may build the `.rfm1` ourselves. The questions marked *(only if we build it)* are for that case. Authors who want to add `.rfm1` files to their own releases: see [remotefm1format](https://github.com/Quixotic7/remotefm1format).

  - type: dropdown
    id: role
    attributes:
      label: Who are you?
      options:
        - I am the firmware's author or a maintainer
        - I am a fan (not the author; the author will be told)
    validations:
      required: true

  - type: input
    id: name
    attributes:
      label: Firmware name
      placeholder: Felucca
    validations:
      required: true

  - type: dropdown
    id: build
    attributes:
      label: What do its releases have?
      options:
        - .rfm1 files (link below)
        - Only FM-1 .fwsc files (please build the .rfm1)
    validations:
      required: true

  - type: input
    id: rfm1_url
    attributes:
      label: Link to the .rfm1
      description: Best a GitHub release asset, so newer releases are picked up automatically every night.
      placeholder: https://github.com/you/your-firmware/releases/download/v1.2.3/yourfw-1.2.3.rfm1

  - type: input
    id: rfm1m_url
    attributes:
      label: Link to the Ableton Move version (.rfm1m), if there is one
      description: Built from the same .rfm1, in the same release.
      placeholder: https://github.com/you/your-firmware/releases/download/v1.2.3/yourfw-1.2.3.rfm1m

  - type: input
    id: repo
    attributes:
      label: Source repository
      description: Where people can find the firmware. Required if we build it (a public GitHub repository).
      placeholder: https://github.com/you/your-firmware

  - type: input
    id: authors
    attributes:
      label: Author name(s), as they should be credited
      placeholder: Jane Example
    validations:
      required: true

  - type: input
    id: release
    attributes:
      label: Release to build from (only if we build it)
      description: Preferably a stable GitHub release (not a draft, not a pre-release, a tag like v1.2.3). For a beta, give it here and say so under "Anything else".
      placeholder: https://github.com/you/your-firmware/releases/tag/v1.2.3

  - type: input
    id: license
    attributes:
      label: Licence, SPDX id (only if we build it)
      description: As in the repository's LICENSE file. We can only build and distribute a firmware whose licence allows it.
      placeholder: GPL-3.0-only

  - type: textarea
    id: third_party
    attributes:
      label: Third-party material (only if we build it)
      description: Samples, wavetables, fonts, images, presets or code that are not the author's. Name each and its licence, or write "none". Third-party preset dumps or raw .syx / .mid / .wav files can't be in a build we make.

  - type: input
    id: id
    attributes:
      label: Firmware id (if you know it)
      description: The manifest id, lower case a-z, 0-9 and _ only, at most 31 characters.
      placeholder: yourfw

  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Synth
        - Groovebox
        - Chords
        - Drums
        - Other
    validations:
      required: true

  - type: input
    id: tag
    attributes:
      label: Short subtitle (up to 40 characters)
      placeholder: Granular sampler

  - type: textarea
    id: what
    attributes:
      label: Description (one paragraph, up to 600 characters)
      description: Shown when a user selects the firmware. Plain words, what it does and how it feels.

  - type: input
    id: image
    attributes:
      label: Card picture
      description: A square PNG, JPEG or WebP, up to 1 MiB, 512 x 512 recommended (a screenshot works well). A link, or drop it in the description box above. Leave empty and we capture the firmware's screen.

  - type: input
    id: site
    attributes:
      label: Firmware web page (optional, https)
      placeholder: https://you.github.io/your-firmware/

  - type: input
    id: editor
    attributes:
      label: Web editor or manager page (optional, https)
      description: Your own page; RemoteFM1 opens it with Web MIDI connected to the firmware running in the app.
      placeholder: https://you.github.io/your-firmware/editor/

  - type: input
    id: port
    attributes:
      label: USB MIDI port name (optional)
      description: Exactly as the firmware's USB descriptor gives it. Editors look for a port with this name.
      placeholder: YourFW FM-1

  - type: checkboxes
    id: extras
    attributes:
      label: Optional extras the .rfm1 uses (tick what applies; none is fine)
      options:
        - label: RemoteFM1Metadata.json at the repository root (card, skin, labels, target)
        - label: A skin (background image and colours)
        - label: Fixed or live panel labels
        - label: Knob readouts (rd1)
        - label: Move takeover (tk1)
        - label: Engine parameters (ep1)
        - label: Second core on a host thread (cpu2)
        - label: Audio input (ain1)
        - label: More output channels (aout1)
        - label: Fantasy CFW (runs in RemoteFM1 only, uses the shared folder)
        - label: Spoken words through the FM-1 screen reader protocol

  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: I understand that listing, hosting and removal are the catalog maintainer's decision.
          required: true

  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Known issues in the browser or on the Move, a beta you would rather we waited on, people to credit.
